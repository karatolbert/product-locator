name: Inspect customer name fields (temporary)
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Show name fields for entity-style names
        env:
          KEY: ${{ secrets.LEAFLINK_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          url = "https://app.leaflink.com/api/v2/customers/?limit=200"
          n = 0
          while url and n < 600:
              r = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"Authorization": "App " + os.environ["KEY"]})))
              for c in r["results"]:
                  n += 1
                  nm = " | ".join(str(c.get(k) or "") for k in ("name", "dba", "nickname", "display_name"))
                  if re.search(r"\b(LLC|Inc)\b", nm, re.I):
                      print("NAMES:", nm)
              url = r.get("next")
          print("keys:", sorted(r["results"][0].keys()))
          PY
