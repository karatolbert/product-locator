name: Inspect strain fields (temporary)
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.LEAFLINK_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, collections
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"Authorization": "App " + os.environ["KEY"]})))
          url = "https://app.leaflink.com/api/v2/products/?limit=200"; ps = []
          while url:
              r = get(url); ps += r["results"]; url = r.get("next")
          brands = {b["id"]: b["name"] for b in get("https://app.leaflink.com/api/v2/brands/?limit=100")["results"]}
          c = collections.Counter((brands.get(p.get("brand"), "?"), p.get("strain_classification") or "-") for p in ps)
          for k, v in sorted(c.items()): print("CLASS:", k, v)
          for p in ps:
              if brands.get(p.get("brand")) in ("Oil", "Sesh", "Wisenheimer", "Panacea") and (p.get("strain_classification") or "") not in ("", "hybrid"):
                  print("NONHYB:", brands.get(p.get("brand")), "|", (p.get("display_name") or p.get("name"))[:70], "|", p.get("strain_classification"))
          PY
