name: Inspect strain fields (temporary)
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.LEAFLINK_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, collections
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request("https://app.leaflink.com/api/v2/" + u, headers={"Authorization": "App " + os.environ["KEY"]})))
          r = get("products/?limit=200")
          ps = r["results"]
          print("KEYS:", sorted(ps[0].keys()))
          hits = collections.Counter()
          for p in ps:
              for k, v in p.items():
                  if any(w in k.lower() for w in ("strain", "classif", "genetic", "lineage", "category", "subcategory", "tag", "type")):
                      hits[(k, json.dumps(v)[:80])] += 1
          for (k, v), n in hits.most_common(40):
              print("FIELD:", n, k, v)
          for p in ps[:200]:
              txt = json.dumps(p).lower()
              if any(w in txt for w in ("indica", "sativa", "hybrid")):
                  print("MENTION:", p.get("name"), "|", [k for k, v in p.items() if any(w in json.dumps(v).lower() for w in ("indica", "sativa", "hybrid"))])
          for path in ("strains/?limit=5", "product-categories/?limit=50"):
              try: print(path, json.dumps(get(path))[:700])
              except Exception as e: print(path, "ERR", e)
          PY
